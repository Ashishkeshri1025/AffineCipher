<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affine Cipher Encryptor/Decryptor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Affine Cipher</h1>
        

        <div class="space-y-6">
            <div>
                <label for="messageInput">Message</label>
                <input type="text" id="messageInput" placeholder="Enter your text">
            </div>
            <div class="input-group">
                <div>
                    <label for="aInput">Value of 'a'</label>
                    <input type="number" id="aInput" placeholder="e.g., 5">
                </div>
                <div>
                    <label for="bInput">Value of 'b'</label>
                    <input type="number" id="bInput" placeholder="e.g., 8">
                </div>
            </div>
            
            <div id="error-message" class="error-message"></div>
        </div>

       
        <div class="btn-group">
            <button onclick="handleEncrypt()" class="btn btn-blue">Encrypt</button>
            <button onclick="handleDecrypt()" class="btn btn-gray">Decrypt</button>
        </div>

       
        <div class="output-section">
            <h2>Result:</h2>
            <div id="resultOutput">
             Your encrypted or decrypted text will appear here.
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
